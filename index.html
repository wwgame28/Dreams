<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090713" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dreams" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Dreams — Город забытых снов</title>
</head>
<body>
  <main class="game-shell">
    <section class="dream-screen" aria-labelledby="game-title">
      <canvas id="particleCanvas" aria-hidden="true"></canvas>
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="moon" aria-hidden="true"><span></span></div>
      <div class="stars stars-near"></div>
      <div class="stars stars-far"></div>
      <div class="mountains mountains-back"></div>
      <div class="mountains mountains-front"></div>
      <div class="dream-city" aria-hidden="true">
        <i style="--x:4%;--w:12%;--h:48%"></i><i style="--x:14%;--w:9%;--h:68%"></i>
        <i style="--x:23%;--w:15%;--h:43%"></i><i style="--x:37%;--w:10%;--h:76%"></i>
        <i style="--x:48%;--w:14%;--h:57%"></i><i style="--x:61%;--w:8%;--h:84%"></i>
        <i style="--x:69%;--w:16%;--h:51%"></i><i style="--x:84%;--w:12%;--h:70%"></i>
      </div>
      <div class="reflection"></div>
      <div class="fog fog-one"></div>
      <div class="fog fog-two"></div>
      <div class="vignette"></div>
      <div class="grain"></div>

      <header class="topbar">
        <div class="chapter-mark"><span>Ⅰ</span><small>ПРОЛОГ</small></div>
        <button class="glass-icon" id="soundButton" aria-label="Включить или выключить звук">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.8 8.2H3v7.6h3.8L11 19V5Zm4.2 3.2a5.4 5.4 0 0 1 0 7.6m2.7-10.3a9.2 9.2 0 0 1 0 13"/></svg>
        </button>
      </header>

      <div class="hero-content">
        <p class="kicker"><span></span> ролевая история</p>
        <h1 id="game-title">Dreams</h1>
        <p class="subtitle">Город забытых снов</p>
        <div class="ornament"><span></span><b>✦</b><span></span></div>
        <p class="tagline">Некоторые сны помнят тебя.<br>Некоторые не отпускают.</p>

        <div class="actions">
          <button class="primary-button" id="startButton">
            <span class="button-glow"></span>
            <span>Начать историю</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <button class="secondary-button" id="continueButton" disabled>
            <span>Продолжить</span><small>нет сохранений</small>
          </button>
          <button class="install-button" id="installButton" hidden>Установить игру</button>
        </div>
      </div>

      <footer>
        <span>Версия 0.2</span><i></i><span>Доступно офлайн</span>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
